openapi: 3.1.0
info:
  title: POSEIDON Disaster Intelligence & Autonomous Relief API
  version: 1.0.0
  description: >
    API specification for POSEIDON real-time disaster-response coordination platform.
    Supports verify reports, score affected areas, allocate resources, compute routes,
    re-plan under network changes, and stream updates over WebSocket.
servers:
  - url: http://localhost:8000/api
    description: Local FastAPI Backend
paths:
  /auth/login:
    post:
      summary: Operator Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: Authenticated user with role
  /auth/me:
    get:
      summary: Current session info
      responses:
        '200':
          description: Current user profile
  /incidents:
    get:
      summary: List all active incidents
      responses:
        '200':
          description: List of incidents
  /areas:
    get:
      summary: List ranked affected areas / wards
      responses:
        '200':
          description: Ranked areas with factor breakdown
  /weights:
    get:
      summary: Get priority scoring weights
      responses:
        '200':
          description: Current weights
    post:
      summary: Update priority scoring weights (Supervisor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated weights
  /resources:
    get:
      summary: List resource inventory & units
      responses:
        '200':
          description: List of units
  /assignments:
    get:
      summary: List assignments (proposed, approved, active)
      responses:
        '200':
          description: List of assignments
  /assignments/{id}/approve:
    post:
      summary: Operator approves a proposed assignment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Approved assignment
  /assignments/{id}/reject:
    post:
      summary: Operator rejects a proposed assignment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        '200':
          description: Rejected assignment
  /assignments/{id}/edit:
    post:
      summary: Operator modifies assignment target or assigned unit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unitId: { type: string }
                targetWardId: { type: string }
                reason: { type: string }
              required: [unitId, targetWardId]
      responses:
        '200':
          description: Updated assignment with recalculated route
  /roads:
    get:
      summary: Road network segments and flood status
      responses:
        '200':
          description: List of road segments
  /shelters:
    get:
      summary: Relief shelters occupancy and supplies
      responses:
        '200':
          description: List of shelters
  /hospitals:
    get:
      summary: Hospital capacity and ICU availability
      responses:
        '200':
          description: List of hospitals
  /weather/alerts:
    get:
      summary: Current severe meteorological alerts
      responses:
        '200':
          description: List of alerts
  /sensors:
    get:
      summary: River and rainfall sensor telemetry
      responses:
        '200':
          description: List of sensor readings
  /decisions/{id}:
    get:
      summary: Explainable Decision Card data
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Decision card with mathematical attribution and alternatives
  /logs:
    get:
      summary: Virtualized audit and event logs
      responses:
        '200':
          description: List of audit log entries
  /replan/diff:
    get:
      summary: Latest replan diff from network disruption
      responses:
        '200':
          description: Replan diff
  /replan/{diffId}/approve-all:
    post:
      summary: Operator approves entire replan diff batch
      parameters:
        - name: diffId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approved replan
  /simulate/inject:
    post:
      summary: Inject scenario event into simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum: [close_bridge, fill_shelter, drop_unit, send_rumour, send_official_bulletin, faulty_sensor]
              required: [event]
      responses:
        '200':
          description: Injected event confirmation
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
